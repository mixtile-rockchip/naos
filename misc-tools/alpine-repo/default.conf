server {
    listen 80;
    server_name _;
    root /data/;

    location ~ ^/(.*)$ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        location ~ \.apk$ {
            types { }
            default_type application/octet-stream;
            add_header Content-Disposition "attachment";
        }

        location ~ \.tar.gz$ {
            types { }
            default_type application/gzip;
        }
    }

    location /download/ {
        alias /root/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    access_log /var/log/nginx/alpine-repo.access.log main;
    error_log /var/log/nginx/alpine-repo.error.log notice;
}
